    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f9ff;
        color: #26364a;
        line-height: 1.6;
    }

    /* HEADER */
    header {
        background: linear-gradient(135deg, #0066cc, #00a8e8);
        color: white;
        text-align: center;
        padding: 70px 20px;
    }

    header h1 {
        font-size: 55px;
        margin-bottom: 10px;
    }

    header p {
        font-size: 21px;
    }

    /* NAVIGATION */
    nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: white;
        padding: 14px;
        text-align: center;
        box-shadow: 0 3px 15px rgba(0, 70, 140, 0.12);
    }

    nav a {
        color: #26364a;
        text-decoration: none;
        margin: 7px 10px;
        font-weight: bold;
        display: inline-block;
    }

    nav a:hover {
        color: #0077cc;
    }

    /* GENERAL */
    section {
        padding: 70px 8%;
    }

    .section-title {
        text-align: center;
        font-size: 35px;
        margin-bottom: 35px;
        color: #0077cc;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 90, 160, 0.08);
        margin-bottom: 25px;
    }

    /* MISSION */
    .mission {
        text-align: center;
        max-width: 900px;
        margin: auto;
        font-size: 19px;
    }

    /* CEO */
    .ceo {
        text-align: center;
    }

    .ceo-box {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 5px 20px rgba(0, 90, 160, 0.1);
        text-align: center;
    }

    .ceo-avatar {
        width: 130px;
        height: 130px;
        margin: auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #0077cc, #4fc3f7);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
    }

    .ceo-box h3 {
        margin-top: 15px;
        font-size: 25px;
        color: #0066cc;
    }

    /* STORY */
    .story {
        max-width: 900px;
        margin: auto;
        font-size: 18px;
    }

    /* CREATORS */
    .creator-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
    }

    .creator {
        background: white;
        padding: 30px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 5px 18px rgba(0, 90, 160, 0.08);
    }

    .creator-icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    .creator h3 {
        color: #0077cc;
    }

    /* SHOP */
    .shop-controls {
        text-align: center;
        margin-bottom: 35px;
    }

    #search {
        width: min(600px, 90%);
        padding: 15px 20px;
        border: 2px solid #b9e3ff;
        border-radius: 30px;
        font-size: 16px;
        outline: none;
    }

    #search:focus {
        border-color: #0077cc;
    }

    .filters {
        margin-top: 20px;
    }

    .filter-btn {
        border: none;
        background: #dff2ff;
        color: #005b99;
        padding: 10px 18px;
        margin: 5px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
    }

    .filter-btn:hover,
    .filter-btn.active {
        background: #0077cc;
        color: white;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 25px;
    }

    .product {
        background: white;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 90, 160, 0.08);
        transition: 0.3s;
        position: relative;
    }

    .product:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 28px rgba(0, 90, 160, 0.15);
    }

    .featured-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        background: #0077cc;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        z-index: 2;
    }

    .product-image {
        height: 190px;
        background: #e8f6ff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .emoji-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: 70px;
    }

    .product-content {
        padding: 22px;
    }

    .product-content h3 {
        margin-bottom: 8px;
        color: #26364a;
    }

    .category {
        color: #0077cc;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .product-content p {
        font-size: 14px;
        color: #667788;
        margin-bottom: 15px;
    }

    .product-buttons {
        display: flex;
        gap: 8px;
    }

    .btn {
        border: none;
        padding: 11px 15px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .btn-primary {
        background: #0077cc;
        color: white;
        flex: 1;
    }

    .btn-primary:hover {
        background: #005fa3;
    }

    .btn-secondary {
        background: #dff2ff;
        color: #0077cc;
    }

    /* FEATURED */
    .featured-section {
        background: #eaf7ff;
    }

    /* CART */
    .cart-box {
        max-width: 900px;
        margin: auto;
    }

    .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px solid #e2edf5;
        gap: 15px;
    }

    .cart-item-info {
        flex: 1;
    }

    .quantity {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .quantity button {
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #dff2ff;
        color: #0066aa;
        cursor: pointer;
        font-weight: bold;
    }

    .remove-btn {
        border: none;
        background: transparent;
        color: #e74c3c;
        cursor: pointer;
        font-weight: bold;
    }

    .cart-empty {
        text-align: center;
        padding: 25px;
        color: #777;
    }

    .clear-cart {
        margin-top: 20px;
        background: #455a64;
        color: white;
    }

    /* CHECKOUT */
    .checkout-box {
        max-width: 800px;
        margin: auto;
    }

    form {
        display: grid;
        gap: 15px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbddea;
        border-radius: 12px;
        font-size: 15px;
        font-family: inherit;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;
        border-color: #0077cc;
        box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.1);
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    label {
        font-weight: bold;
    }

    .payment-options {
        display: grid;
        gap: 10px;
        margin-top: 10px;
    }

    .payment-option {
        background: #eef9ff;
        padding: 15px;
        border-radius: 12px;
        cursor: pointer;
    }

    .payment-option input {
        width: auto;
        margin-right: 8px;
    }

    .send-btn {
        background: #0077cc;
        color: white;
        padding: 15px;
        border: none;
        border-radius: 30px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .send-btn:hover {
        background: #005fa3;
    }

    /* CONFIRMATION */
    .confirmation {
        background: #eaf7ff;
        border: 2px solid #8bd5ff;
        padding: 25px;
        border-radius: 18px;
        margin-top: 25px;
    }

    .confirmation h3 {
        color: #0077cc;
    }

    /* INSTAGRAM */
    .instagram {
        text-align: center;
        background: linear-gradient(135deg, #005bea, #00c6fb);
        color: white;
        border-radius: 25px;
        padding: 55px 20px;
    }

    .instagram a {
        display: inline-block;
        margin-top: 20px;
        background: white;
        color: #0066cc;
        padding: 14px 25px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
    }

    .instagram a:hover {
        background: #eaf7ff;
    }

    /* TESTIMONIALS */
    .testimonial-box {
        text-align: center;
        max-width: 850px;
        margin: auto;
    }

    .feedback-note {
        background: #eef9ff;
        padding: 25px;
        border-radius: 18px;
        margin-bottom: 25px;
    }

    /* FAQ */
    .faq {
        max-width: 900px;
        margin: auto;
    }

    details {
        background: white;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0, 90, 160, 0.06);
    }

    summary {
        cursor: pointer;
        font-weight: bold;
        color: #0077cc;
    }

    /* CONTACT */
    .contact-box {
        max-width: 700px;
        margin: auto;
    }

    /* TOAST */
    #toast {
        position: fixed;
        bottom: 25px;
        right: 25px;
        background: #0066cc;
        color: white;
        padding: 15px 22px;
        border-radius: 30px;
        display: none;
        z-index: 2000;
    }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        z-index: 3000;
        inset: 0;
        background: rgba(0, 35, 70, 0.65);
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-content {
        background: white;
        max-width: 550px;
        width: 100%;
        padding: 35px;
        border-radius: 25px;
        position: relative;
    }

    .close-modal {
        position: absolute;
        right: 20px;
        top: 15px;
        border: none;
        background: transparent;
        color: #0077cc;
        font-size: 30px;
        cursor: pointer;
    }

    /* FOOTER */
    footer {
        background: #082b49;
        color: white;
        text-align: center;
        padding: 35px 20px;
    }

    footer a {
        color: #58c7ff;
        text-decoration: none;
    }

    /* BACK TO TOP */
    #topBtn {
        position: fixed;
        right: 20px;
        bottom: 80px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: none;
        background: #0077cc;
        color: white;
        cursor: pointer;
        font-size: 20px;
        display: none;
        z-index: 1000;
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 40px;
        }

        section {
            padding: 50px 5%;
        }

        .cart-item {
            flex-direction: column;
            align-items: flex-start;
        }
    }
        </style>
